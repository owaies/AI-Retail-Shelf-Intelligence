name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      RUN_CV_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest
      - name: Start API smoke server
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/retail-api.log 2>&1 &
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:8000/api/health && exit 0; sleep 1; done
          cat /tmp/retail-api.log
          exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
